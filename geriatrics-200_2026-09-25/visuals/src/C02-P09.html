<!doctype html><html><head><meta charset="utf-8"><title>C02-P09 How far beyond the front door</title>
<link rel="stylesheet" href="../design_system/base.css">
<script src="../design_system/chart.js"></script>
<script src="../design_system/kit.js"></script>
<script>window.__ready = false;</script>
<style>
 .sub { font-size: 30px; line-height: 1.35; color: var(--ink-2); font-weight: 600; margin-top: 16px; }
 .note { margin-top: 20px; font-size: 28px; line-height: 1.36; color: var(--ink-2); }
 .tagline { display:inline-block; align-self:flex-start; background: var(--orange); color: var(--white); font-weight: 800; font-size: 26px; border-radius: 999px; padding: 6px 18px; margin-bottom: 14px; }
 .flow .step small { display:block; font-weight:500; font-size:28px; margin-top:6px; }
 .key { list-style: none; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
 .key li { font-size: 31px; line-height: 1.3; }
 .key li b { font-family: "Montserrat"; font-weight: 800; color: var(--orange); }
 .fact { margin-top: 16px; border-left: 8px solid var(--teal); background: var(--mint); border-radius: 0 16px 16px 0; padding: 16px 24px; font-size: 29px; line-height: 1.34; }
 .compare .col h3 { font-family: Montserrat; font-weight: 800; }
 .illus { display:inline-block; margin-top: 14px; }
 #chart svg, .chartwrap svg { display:block; }
</style></head><body><div class="sheet">
<div class="card " id="s1">
 <div class="topline"><span class="series">What gets counted</span></div>
 <div class="content">

  <div class="kicker">Life-space: the last 4 weeks</div>
  <h1 class="s">How far <em>beyond the front door?</em></h1>
  <p class="sub">After a medical admission: about 10 points lost (0 to 120), not regained on average up to 2 years later.</p>
  <div id="rings" style="margin-top:20px"></div>
 </div>
 <div class="foot"><span class="author">Alasdair MacLullich</span><span class="src">Baker et al., JAGS 2003; Brown et al., Ann Intern Med 2009</span></div>
</div>
</div>
<script>

(function(){
 const W=920,H=600,cx=260,cy=300;
 const names=['Other rooms','Outside your door','Neighbourhood','Your town','Beyond your town'];
 const rad=[70,115,160,205,250], fills=['#FFFFFF','#DCEBEA','#B9CDCC','#EFE6D6','#FBFAF6'];
 let p='';
 for(let i=4;i>=0;i--) p+=`<circle cx="${cx}" cy="${cy}" r="${rad[i]}" fill="${fills[i]}" stroke="#15535B" stroke-width="3"/>`;
 p+=`<circle cx="${cx}" cy="${cy}" r="70" fill="none" stroke="#C24E12" stroke-width="6" stroke-dasharray="14 10"/>`;
 p+=`<path d="M${cx-36} ${cy+30} V${cy-6} L${cx} ${cy-38} L${cx+36} ${cy-6} V${cy+30} Z" fill="#15535B" stroke="#1F2A30" stroke-width="3"/><rect x="${cx-8}" y="${cy+6}" width="16" height="24" fill="#FBFAF6"/>`;
 names.forEach((n,i)=>{
   const my=i===0?cy+52:cy-(rad[i]+rad[i-1])/2;
   p+=`<circle cx="${cx}" cy="${my}" r="17" fill="#C24E12"/><text x="${cx}" y="${my+9}" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="26" fill="#FFFFFF">${i+1}</text>`;
   const ky=60+i*66;
   p+=`<circle cx="572" cy="${ky}" r="19" fill="#C24E12"/><text x="572" y="${ky+9}" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="26" fill="#FFFFFF">${i+1}</text>`;
   p+=`<text x="604" y="${ky+10}" font-family="Inter" font-weight="600" font-size="30" fill="#1F2A30">${n}</text>`;
 });
 p+=`<line x1="${cx+50}" y1="${cy+50}" x2="548" y2="480" stroke="#C24E12" stroke-width="4"/>`;
 p+=`<rect x="548" y="440" width="364" height="130" rx="16" fill="#FFFFFF" stroke="#C24E12" stroke-width="4"/>`;
 p+=`<text x="566" y="485" font-family="Inter" font-weight="700" font-size="30" fill="#1F2A30">Daily-living</text><text x="566" y="522" font-family="Inter" font-weight="700" font-size="30" fill="#1F2A30">scores stop here</text>`;
 p+=`<text x="566" y="560" font-family="Inter" font-weight="500" font-size="26" fill="#5F6B76">Life-space counts all five</text>`;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width',W); svg.setAttribute('height',H);
 svg.innerHTML=p; document.querySelector('#rings').appendChild(svg);
})();

window.__ready = true;
</script></body></html>
